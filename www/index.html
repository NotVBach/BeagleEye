<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN Camera</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --text: #e6e8ee;
    --muted: #8b90a0;
    --live: #22c55e;
    --off: #ef4444;
    --accent: #3b82f6;
    --known: #22c55e;
    --unknown: #f59e0b;
    --face: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 14px;
  }
  header {
    width: 100%;
    max-width: 960px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  h1 { font-size: 1.2rem; font-weight: 600; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--off);
  }
  .dot.live { background: var(--live); animation: pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  .viewer {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .viewer img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .viewer canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.95rem;
    background: #000;
  }
  .overlay.hidden { display: none; }

  .faces {
    width: 100%;
    max-width: 960px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .faces strong { color: var(--text); font-weight: 600; }

  .known { width: 100%; max-width: 960px; }
  .known h2 { font-size: 1rem; margin: 0 0 8px; }
  .known-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .known-card { background: var(--panel); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .known-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; background: #000; }
  .known-card input { width: 100%; box-sizing: border-box; padding: 6px; border-radius: 6px;
                      border: 1px solid #2a2f3a; background: #000; color: var(--text); font-size: 0.9rem; }
  .known-card small { color: var(--muted); overflow-wrap: anywhere; }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #2a2f3a;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: scale(0.97); }
  footer { font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>LAN Camera</h1>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">Connecting…</span>
  </div>
</header>

<div class="viewer" id="viewer">
  <img id="stream" alt="Live camera stream">
  <canvas id="boxes"></canvas>
  <div class="overlay" id="overlay">Connecting to camera…</div>
</div>

<div class="faces">
  <span id="faceList">Face detection: connecting…</span>
  <span id="faceRate"></span>
</div>

<section class="known">
  <h2>Known faces</h2>
  <div class="known-grid" id="knownGrid"></div>
</section>

<div class="controls">
  <button id="fsBtn">⛶ Fullscreen</button>
  <button id="reloadBtn">↻ Reconnect</button>
</div>

<footer id="clock"></footer>

<script>
  const STREAM_URL = "/stream";
  const EVENTS_URL = "/events";
  const RETRY_MS = 3000;
  const STALE_MS = 2000;

  const img = document.getElementById("stream");
  const canvas = document.getElementById("boxes");
  const ctx = canvas.getContext("2d");
  const viewer = document.getElementById("viewer");
  const dot = document.getElementById("dot");
  const statusText = document.getElementById("statusText");
  const overlay = document.getElementById("overlay");
  const faceList = document.getElementById("faceList");
  const faceRate = document.getElementById("faceRate");
  const css = getComputedStyle(document.documentElement);
  const COLORS = {
    known: css.getPropertyValue("--known").trim(),
    unknown: css.getPropertyValue("--unknown").trim(),
    face: css.getPropertyValue("--face").trim(),
  };

  let retryTimer = null;
  let eventsTimer = null;
  let events = null;
  let result = null;
  let resultAt = 0;

  function setStatus(live, text) {
    dot.classList.toggle("live", live);
    statusText.textContent = text;
    overlay.classList.toggle("hidden", live);
    if (!live) overlay.textContent = text;
  }

  function connect() {
    clearTimeout(retryTimer);
    setStatus(false, "Connecting…");
    // cache-buster so the browser opens a fresh connection
    img.src = STREAM_URL + "?t=" + Date.now();
    connectEvents();
  }

  function connectEvents() {
    clearTimeout(eventsTimer);
    if (events) events.close();
    events = new EventSource(EVENTS_URL);
    events.onmessage = (e) => {
      result = JSON.parse(e.data);
      resultAt = Date.now();
      if (result.known !== knownCount) loadKnown();
      showFaces();
      draw();
    };
    events.onerror = () => {
      result = null;
      faceList.textContent = "Face detection: off or unreachable";
      faceRate.textContent = "";
      draw();
      if (events.readyState === EventSource.CLOSED)
        eventsTimer = setTimeout(connectEvents, RETRY_MS);
    };
  }

  // a result is stale after 2 s, or after 2.5 detection intervals when detection is slower than that
  function isStale() {
    const interval = result && result.fps > 0 ? 1000 / result.fps : 0;
    return Date.now() - resultAt > Math.max(STALE_MS, 2.5 * interval);
  }

  function label(f) {
    if (!f.name) return "face " + f.score.toFixed(2);
    if (f.name === "Unknown") return "Unknown";
    return f.name + " " + f.sim.toFixed(2);
  }

  function color(f) {
    if (!f.name) return COLORS.face;
    return f.name === "Unknown" ? COLORS.unknown : COLORS.known;
  }

  function showFaces() {
    const faces = result.faces;
    if (faces.length === 0) {
      faceList.textContent = "No faces";
    } else {
      faceList.innerHTML = "";
      faceList.append("Faces: ");
      faces.forEach((f, i) => {
        const b = document.createElement("strong");
        b.textContent = f.name || "face";
        faceList.append(b);
        if (i < faces.length - 1) faceList.append(", ");
      });
    }
    faceRate.textContent = `${result.fps.toFixed(1)} detections/s · inference ${result.infer_ms} ms · ` +
      `CPU ${result.cpu >= 0 ? result.cpu + "%" : "n/a"} · ${result.known} known photo(s)`;
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const cw = viewer.clientWidth, ch = viewer.clientHeight;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);

    if (!result || !img.naturalWidth || isStale()) return;

    // area the image actually covers inside the viewer (object-fit: contain)
    const scale = Math.min(cw / img.naturalWidth, ch / img.naturalHeight);
    const iw = img.naturalWidth * scale, ih = img.naturalHeight * scale;
    const ox = (cw - iw) / 2, oy = (ch - ih) / 2;

    ctx.lineWidth = 2;
    ctx.font = "600 14px system-ui, sans-serif";
    ctx.textBaseline = "bottom";
    for (const f of result.faces) {
      const x = ox + f.x * iw, y = oy + f.y * ih, w = f.w * iw, h = f.h * ih;
      const c = color(f), text = label(f);
      ctx.strokeStyle = c;
      ctx.strokeRect(x, y, w, h);
      const tw = ctx.measureText(text).width + 10;
      const ty = y > 22 ? y : y + h + 22;
      ctx.fillStyle = c;
      ctx.fillRect(x - 1, ty - 20, tw, 20);
      ctx.fillStyle = "#000";
      ctx.fillText(text, x + 4, ty - 3);
    }
  }

  img.addEventListener("load", () => { setStatus(true, "Live"); draw(); });

  img.addEventListener("error", () => {
    setStatus(false, "Camera offline or busy — retrying…");
    retryTimer = setTimeout(connect, RETRY_MS);
  });

  document.getElementById("reloadBtn").addEventListener("click", connect);

  document.getElementById("fsBtn").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (viewer.requestFullscreen) viewer.requestFullscreen();
    else alert("Fullscreen isn't supported on this browser.");
  });

  new ResizeObserver(draw).observe(viewer);

  setInterval(() => {
    document.getElementById("clock").textContent = new Date().toLocaleString();
    if (result && isStale()) draw();
  }, 1000);

  connect();

  /* Known faces: one card per photo; edit the name and press Enter to rename */
  const knownGrid = document.getElementById("knownGrid");
  let knownCount = -1;

  async function loadKnown() {
    let list;
    try { list = await (await fetch("/api/faces")).json(); } catch { return; }
    knownCount = list.length;
    knownGrid.replaceChildren(...list.map((f) => {
      const card = document.createElement("div");
      card.className = "known-card";
      const photo = document.createElement("img");
      photo.src = "/faces/" + encodeURIComponent(f.file);
      photo.alt = "Photo of " + f.name;
      const input = document.createElement("input");
      input.value = f.name;
      input.setAttribute("aria-label", "Name for " + f.file);
      input.title = "Letters, digits, _ and -. Press Enter to save.";
      const note = document.createElement("small");
      note.textContent = f.file;
      input.addEventListener("keydown", async (e) => {
        if (e.key !== "Enter" || input.value === f.name) return;
        const q = new URLSearchParams({ file: f.file, name: input.value.trim() });
        const r = await fetch("/api/rename?" + q, { method: "POST" }).catch(() => null);
        if (r && r.ok) loadKnown();
        else note.textContent = "Rename failed: use letters, digits, _ or -";
      });
      const del = document.createElement("button");
      del.textContent = "Delete";
      del.setAttribute("aria-label", "Delete " + f.file);
      del.addEventListener("click", async () => {
        if (!confirm(`Delete ${f.file}? This cannot be undone.`)) return;
        const q = new URLSearchParams({ file: f.file });
        const r = await fetch("/api/delete?" + q, { method: "POST" }).catch(() => null);
        if (r && r.ok) loadKnown();
        else note.textContent = "Delete failed";
      });
      card.append(photo, input, note, del);
      return card;
    }));
    if (!list.length) knownGrid.textContent = "No known faces yet.";
  }
  loadKnown();
</script>
</body>
</html>
