<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN Camera</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --text: #e6e8ee;
    --muted: #8b90a0;
    --live: #22c55e;
    --off: #ef4444;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 14px;
  }
  header {
    width: 100%;
    max-width: 960px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  h1 { font-size: 1.2rem; font-weight: 600; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--off);
  }
  .dot.live { background: var(--live); animation: pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  .viewer {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .viewer img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.95rem;
    background: #000;
  }
  .overlay.hidden { display: none; }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #2a2f3a;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: scale(0.97); }
  footer { font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>LAN Camera</h1>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">Connecting…</span>
  </div>
</header>

<div class="viewer" id="viewer">
  <img id="stream" alt="Live camera stream">
  <div class="overlay" id="overlay">Connecting to camera…</div>
</div>

<div class="controls">
  <button id="fsBtn">⛶ Fullscreen</button>
  <button id="reloadBtn">↻ Reconnect</button>
</div>

<footer id="clock"></footer>

<script>
  const STREAM_URL = "/stream";
  const RETRY_MS = 3000;

  const img = document.getElementById("stream");
  const dot = document.getElementById("dot");
  const statusText = document.getElementById("statusText");
  const overlay = document.getElementById("overlay");
  let retryTimer = null;

  function setStatus(live, text) {
    dot.classList.toggle("live", live);
    statusText.textContent = text;
    overlay.classList.toggle("hidden", live);
    if (!live) overlay.textContent = text;
  }

  function connect() {
    clearTimeout(retryTimer);
    setStatus(false, "Connecting…");
    // cache-buster so the browser opens a fresh connection
    img.src = STREAM_URL + "?t=" + Date.now();
  }

  img.addEventListener("load", () => setStatus(true, "Live"));

  img.addEventListener("error", () => {
    setStatus(false, "Camera offline or busy — retrying…");
    retryTimer = setTimeout(connect, RETRY_MS);
  });

  document.getElementById("reloadBtn").addEventListener("click", connect);

  document.getElementById("fsBtn").addEventListener("click", () => {
    const el = document.getElementById("viewer");
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen();
    else alert("Fullscreen isn't supported on this browser.");
  });

  setInterval(() => {
    document.getElementById("clock").textContent = new Date().toLocaleString();
  }, 1000);

  connect();
</script>
</body>
</html>
